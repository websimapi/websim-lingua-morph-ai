<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingua-Morph AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="header">
            <img src="logo.png" alt="Lingua-Morph AI Logo" class="logo">
            <h1>Lingua-Morph AI</h1>
        </div>
        <p>Convert text to any language, dialect, or slang!</p>

        <div class="converter-container">
            <div class="input-section">
                <label for="inputText">Enter Text:</label>
                <textarea id="inputText" rows="6" placeholder="e.g., Hello, how are you? That is a great idea!"></textarea>
            </div>

            <div class="controls-section">
                <label for="styleSelect">Choose a target style:</label>
                <select id="styleSelect">
                    <option value="British Slang">British Slang</option>
                    <option value="Pirate Speak">Pirate Speak</option>
                    <option value="Shakespearean English">Shakespearean English</option>
                    <option value="Gen Z Slang">Gen Z Slang</option>
                    <option value="Formal Business English">Formal Business English</option>
                    <option value="Australian Slang">Australian Slang</option>
                    <option value="Speak in Tongues">Speak in Tongues</option>
                    <option value="custom">Custom...</option>
                </select>
                <input type="text" id="customStyle" placeholder="e.g., Valley Girl, Klingon..." style="display: none;">
            </div>

            <button id="convertBtn">
                <span class="btn-text">Convert</span>
                <span id="loader" class="loader" style="display: none;"></span>
            </button>

            <div class="output-section">
                <label for="outputText">Converted Text:</label>
                <textarea id="outputText" rows="6" readonly placeholder="Your converted text will appear here..."></textarea>
            </div>
        </div>
    </main>
    <script src="script.js" type="module"></script>

</body>
</html>
